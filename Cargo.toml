[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/core",
    "crates/db",
    "crates/models",
    "crates/websocket",
    "crates/plugins",
    "crates/config",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["mbohblesspearl@gmail.com"]

[workspace.dependencies]
# Web framework
axum = "0.8.6"
tokio = { version = "1", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["cors", "trace", "fs"] }

# Database
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "json"] }
redis = { version = "0.32.7", features = ["tokio-comp", "connection-manager"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Authentication
jsonwebtoken = "10.1.0"
argon2 = "0.5"
rand = "0.9.2"  

# WebSockets
tokio-tungstenite = "0.28.0"
futures = "0.3"

uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0.17"

config = "0.15.18"
dotenvy = "0.15.7"

# Logging
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async utilities
async-trait = "0.1.50"